<!DOCTYPE html>
<html>
<head>
    <title>Simple Selectors</title>
    <style>
        p { color: blue; }                /* element */
        #id1 { color: red; }              /* id */
        .class1 { color: green; }         /* class */
        h1, h2 { color: purple; }         /* group */
        * { font-family: Arial; }         /* universal */
    </style>
</head>
<body>

<h1>Heading 1</h1>
<h2>Heading 2</h2>

<p>This is paragraph</p>
<p id="id1">ID selector</p>
<p class="class1">Class selector</p>

</body>
</html>
