<!DOCTYPE html>
<html>
<head>
    <title>JS Objects</title>
</head>
<body>

<h2 id="demo"></h2>

<script>
    // document object
    document.getElementById("demo").innerHTML = "Using document object";

    // window object
    window.alert("This is window alert");

    // Math object
    let num = Math.sqrt(25);
    console.log("Square root: " + num);

    // String object
    let str = "Hello World";
    console.log("Length: " + str.length);
    console.log("Uppercase: " + str.toUpperCase());
</script>

</body>
</html>
