<!DOCTYPE html>
<html>
<head>
    <title>Loops</title>
</head>
<body>

<h3>For Loop</h3>
<script>
    for (let i = 1; i <= 10; i++) {
        document.write(i + " ");
    }
</script>

<h3>While Loop</h3>
<script>
    let i = 1;
    while (i <= 10) {
        document.write(i + " ");
        i++;
    }
</script>

<h3>Do-While Loop</h3>
<script>
    let j = 1;
    do {
        document.write(j + " ");
        j++;
    } while (j <= 10);
</script>

</body>
</html>
