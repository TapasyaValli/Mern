<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

<h2>Ordered List</h2>
<ol>
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
</ol>

<h2>Unordered List</h2>
<ul>
    <li>Car</li>
    <li>Bike</li>
    <li>Bus</li>
</ul>

<h2>Nested List</h2>
<ul>
    <li>Fruits
        <ol>
            <li>Apple</li>
            <li>Orange</li>
        </ol>
    </li>
</ul>

<h2>Ordered List inside Unordered List</h2>
<ul>
    <li>Subjects
        <ol>
            <li>Math</li>
            <li>Science</li>
        </ol>
    </li>
</ul>

<h2>Definition List</h2>
<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>

    <dt>CSS</dt>
    <dd>Used for styling web pages</dd>
</dl>

</body>
</html>
