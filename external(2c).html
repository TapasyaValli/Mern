<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>
    <style>
        .name { color: red; }
        .hex { color: #00ff00; }
        .rgb { color: rgb(0, 0, 255); }
        .rgba { color: rgba(255, 0, 0, 0.5); }
        .hsl { color: hsl(120, 100%, 50%); }
    </style>
</head>
<body>

<p class="name">Color Name</p>
<p class="hex">HEX Value</p>
<p class="rgb">RGB Value</p>
<p class="rgba">RGBA Value</p>
<p class="hsl">HSL Value</p>

</body>
</html>
