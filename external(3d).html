<!DOCTYPE html>
<html>
<head>
    <title>JS Output</title>
</head>
<body>

<h2 id="demo"></h2>

<script>
    // innerHTML
    document.getElementById("demo").innerHTML = "Hello World";

    // document.write
    document.write("<p>Using document.write()</p>");

    // alert
    alert("This is alert box");

    // console
    console.log("This is console output");
</script>

</body>
</html>
